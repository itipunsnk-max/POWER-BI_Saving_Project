name: Public data safety

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation scripts
        run: python -m py_compile tools/check_public_repo.py tools/validate_analytics_assets.py

      - name: Enforce public repository contract
        run: python tools/check_public_repo.py

      - name: Validate analytical aggregates
        run: python tools/validate_analytics_assets.py
